# Per-package capability overrides. Selection still comes only from packages.txt
# and packages.auto.txt: an entry here never selects a package by itself, it only
# decides what an already selected process receives.
#
# <package or package:process>=<mode>
#   inherit     use spoof_properties/spoof_build_fields/observe_properties from options.conf
#   full        SystemProperties hooks and Build fields
#   properties  SystemProperties hooks only
#   build       Build fields only; no JNI hooks, the module unloads after specialization
#   observe     SystemProperties hooks that only log the keys read and change nothing
#   excluded    never inject (same effect as a ! rule in packages.txt)
#
# A package entry also covers its colon subprocesses. An exact package:process
# entry wins over the package entry, excluded wins over both, and an unknown mode
# excludes the process. Manage entries with: mipushctl mode <rule> <mode>
#
# Examples:
# com.example.app=build
# com.example.app:push=full
