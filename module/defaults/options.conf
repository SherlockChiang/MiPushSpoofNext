# 0 = errors, 1 = lifecycle/info, 2 = debug
log_level=1

# Spoof android.os.SystemProperties in selected processes.
spoof_properties=true

# Rewrite the safe string fields declared by the active profile.
spoof_build_fields=true

# Log each unique SystemProperties key read by a target process, never its value.
# Useful when adapting a new MiPush SDK. Restart the target app after changing it.
observe_properties=false

# Scan third-party APKs by default. Set true to include system APKs (slower).
scan_system_apps=false

# The default scanner uses fast PackageManager component markers. Set true to
# additionally run ART dexlist and compressed-dex fallback for obfuscated SDKs.
# This can be materially slower and is intended for one-time adaptation.
scan_deep=false

# Fallback dex decompression limit per APK (bytes). Set 0 for unlimited.
scan_max_apk_bytes=157286400
